<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SunDrowsy</title>
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        -webkit-app-region: drag;
        user-select: none;
        font-family: -apple-system, 'Segoe UI', sans-serif;
    }

    /* Estado padrão: ocioso (app aberto, mas ainda não monitorando de verdade) */
    #dot {
        width: 34px;
        height: 34px;
        margin: 15px;
        border-radius: 50%;
        background: #8E8E93;
        box-shadow: 0 0 0 3px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.5), 0 0 10px rgba(142,142,147,0.5);
        cursor: pointer;
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    #dot.safe { background: #32D74B; box-shadow: 0 0 0 3px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.5), 0 0 14px rgba(50,215,75,0.7); }
    #dot.warning { background: #FFD028; box-shadow: 0 0 0 3px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.5), 0 0 14px rgba(255,208,40,0.75); }
    #dot.lunch { background: #FF9500; box-shadow: 0 0 0 3px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.5), 0 0 14px rgba(255,149,0,0.75); }
    #dot.danger {
        background: #FF453A;
        box-shadow: 0 0 0 3px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.5), 0 0 18px rgba(255,69,58,0.9);
        animation: pulse 0.7s infinite alternate;
    }
    /* App minimizado/fechado: vermelho fixo (sem pulsar), pra não confundir com "FADIGA" */
    #dot.closed {
        background: #FF453A;
        box-shadow: 0 0 0 3px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.5), 0 0 10px rgba(255,69,58,0.6);
    }

    @keyframes pulse {
        from { transform: scale(1); }
        to { transform: scale(1.12); }
    }
</style>
</head>
<body>
    <div id="dot" title="SunDrowsy — clique para abrir"></div>

    <script>
        const dot = document.getElementById('dot');

        dot.addEventListener('click', () => {
            window.electronAPI?.focusMain();
        });

        window.electronAPI?.onStatus((status) => {
            dot.classList.remove('safe', 'warning', 'danger', 'lunch', 'closed');
            const level = status?.level;
            if (level && level !== 'idle') dot.classList.add(level);
            dot.title = `SunDrowsy — ${status?.label || 'Ocioso'}`;
        });
    </script>
</body>
</html>
